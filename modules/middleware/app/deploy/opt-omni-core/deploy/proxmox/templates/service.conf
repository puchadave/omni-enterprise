# ==============================================================================
# Omni-Core ERP & BI Middleware - Service Configuration Template
# ==============================================================================

# Diese Datei definiert Systemd Service Konfigurationen für den Betrieb
# innerhalb des LXC Containers oder auf dem Proxmox Host.
# Kopieren Sie die relevanten Abschnitte in /etc/systemd/system/.

# ==============================================================================
# POSTGRESQL SERVICE (native Installation)
# ==============================================================================

# [Unit]
# Description=PostgreSQL database server
# After=network.target
#
# [Service]
# Type=notify
# ExecStart=/usr/lib/pgsql/bin/pg_ctl start -D /var/lib/pgsql/data -l /var/lib/pgsql/logfile
# ExecReload=/usr/lib/pgsql/bin/pg_ctl reload -D /var/lib/pgsql/data
# KillMode=process
# Restart=always
# RestartSec=5
#
# [Install]
# WantedBy=multi-user.target

# Hinweis: In LXC Container wird PostgreSQL meist innerhalb des Containers verwaltet.
# Für native Proxmox Host Installation dieses Block verwenden.

# ==============================================================================
# REDIS SERVICE (native Installation)
# ==============================================================================

# [Unit]
# Description=Redis In-Memory Data Store
# After=network.target
#
# [Service]
# Type=notify
# ExecStart=/usr/bin/redis-server --daemonize yes --save "" --appendonly no
# ExecReload=/usr/bin/redis-cli reload
# KillMode=process
# Restart=always
# RestartSec=5
#
# [Install]
# WantedBy=multi-user.target

# ==============================================================================
# WAWI BACKEND SERVICE (FastAPI/UVICORN)
# ==============================================================================

# [Unit]
# Description=Omni-Core Backend API Service
# After=network.target postgresql redis
# Wants=postgresql redis.service
#
# [Service]
# Type=simple
# WorkingDirectory=/wawi
# ExecStart=/usr/local/bin/uvicorn main:app --host 0.0.0.0 --port 8000 --workers 1 --loop uvloop
# Restart=always
# RestartSec=5
# StandardOutput=append:/wawi/logs/backend.log
# StandardError=append:/wawi/logs/backend_error.log
#
# Environment=PATH=/usr/local/bin:/usr/bin:/bin
# Environment=SECRET_KEY=${SECRET_KEY}
# Environment=JWT_SECRET=${JWT_SECRET}
# Environment=POSTGRES_URL=postgresql://omnichat:${POSTGRES_PASSWORD}@localhost:5432/omnicore
# Environment=OMNI_ROUTE_URL=${OMNI_ROUTE_URL}
# Environment=OMNI_ROUTE_API_KEY=${OMNI_ROUTE_API_KEY}
# Environment=MATTERHORN_API_TOKEN=${MATTERHORN_API_TOKEN}
#
# # Resource Limits für LXC-Optimierung
# MemoryLimit=512M
# CPUQuota=2000%  # Entspricht 2 CPU-Kernen
#
# # Optimierungsflags
# ExecStartPost=/usr/bin/sysctl -w vm.overcommit_memory=1
#
# [Install]
# WantedBy=multi-user.target

# ==============================================================================
# WAWI FRONTEND SERVICE (Next.js/React Produktion)
# ==============================================================================

# [Unit]
# Description=Omni-Core Frontend Production Server
# After=network.target
#
# [Service]
# Type=simple
# WorkingDirectory=/wawi/apps/web
# ExecStart=/usr/local/bin/serve -s build -l 3000
# Restart=always
# RestartSec=5
# StandardOutput=append:/wawi/logs/frontend.log
# StandardError=append:/wawi/logs/frontend_error.log
#
# Environment=NODE_ENV=production
# Environment=PORT=3000
#
# # Resource Limits
# MemoryLimit=256M
# CPUQuota=1500%  # Entspricht ca. 1.5 CPU-Kernen
#
# [Install]
# WantedBy=multi-user.target

# ==============================================================================
# WAWI WORKER SERVICE (BullMQ/Import Processing)
# ==============================================================================

# [Unit]
# Description=Omni-Core Worker Processing Queue
# After=network.target redis postgresql
# Wants=redis postgresql.service
#
# [Service]
# Type=simple
# WorkingDirectory=/wavi
# ExecStart=/usr/local/bin/node scripts/worker.js --queue import --max-processes 2
# Restart=always
# RestartSec=5
# StandardOutput=append:/wawi/logs/worker.log
# StandardError=append:/wawi/logs/worker_error.log
#
# Environment=NODE_ENV=production
# Environment=REDIS_URL=redis://localhost:6379
# Environment=QUEUE_NAME=import
# Environment=MAX_PROCESSES=2
#
# # Resource Limits für moderate Last
# MemoryLimit=256M
# CPUQuota=1000%  # Entspricht 1 CPU-Kern
#
# [Install]
# WantedBy=multi-user.target

# ==============================================================================
# HINWEISE
# ==============================================================================

# 1. In LXC Container werden Dienste meist innerhalb des Containers verwaltet
#    mittels supervisord, pm2 oder direkt durch die Applikation.
# 2. Auf dem Proxmox Host laufende Dienste nur verwenden, wenn native Installation.
# 3. Systemd Services im Container erfordern often privileged Mode oder spezchte Config.
# 4. Nach Docker Compose Pattern wird empfohlen, Services über docker compose zu steuern,
#    nicht via systemd im Container (sofern Docker im Container läuft).

