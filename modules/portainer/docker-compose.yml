name: omni-portainer

x-log: &log
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "5" }

services:
  portainer:
    <<: *log
    image: portainer/portainer-ce:${PORTAINER_TAG:-2.21.5}
    container_name: ${COMPOSE_PROJECT_NAME:-omni-portainer}
    restart: unless-stopped
    ports:
      - "${SERVICE_BIND_HOST:-0.0.0.0}:${PORTAINER_HTTP_PORT:-9000}:9000"
      - "${PORTAINER_HTTPS_PORT:-9443}:9443"
      - "${SERVICE_BIND_HOST:-0.0.0.0}:${PORTAINER_EDGE_PORT:-8000}:8000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data
    networks:
      - portainer-net


  zerotier:
    image: ${ZEROTIER_IMAGE:-zerotier/zerotier:latest}
    container_name: ${COMPOSE_PROJECT_NAME:-omni}-zerotier
    restart: unless-stopped
    profiles: ["zt"]
    network_mode: host
    cap_add:
      - NET_ADMIN
      - SYS_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    volumes:
      - zerotier_data:/var/lib/zerotier-one
    environment:
      ZT_NETWORK_ID: ${ZT_NETWORK_ID:-}
    command: ["sh","-lc","zerotier-one -d; sleep 3; if [ -n \"${ZT_NETWORK_ID:-}\" ]; then zerotier-cli join ${ZT_NETWORK_ID} || true; fi; tail -f /dev/null"]
    healthcheck:
      test: ["CMD-SHELL", "zerotier-cli info >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  zerotier_data:
    name: ${COMPOSE_PROJECT_NAME:-omni}_zerotier_data
  portainer_data:
    name: ${COMPOSE_PROJECT_NAME:-omni-portainer}_data

networks:
  portainer-net:
    name: ${COMPOSE_PROJECT_NAME:-omni-portainer}_net
    driver: bridge
