version: "3.9"

# OMNI Enterprise - Swarm Stack (Portainer Git/Repo deploy). Stateful: core/pve04.
x-log: &log
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "5" }

services:
  edge-proxy:
    <<: *log
    image: traefik:v3.1
    command:
      - --providers.swarm=true
      - --providers.swarm.exposedbydefault=false
      - --providers.swarm.endpoint=unix:///var/run/docker.sock
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      - --api.dashboard=true
      - --api.insecure=false
      - --log.level=${TRAEFIK_LOG_LEVEL:-INFO}
    ports:
      - target: 80
        published: 80
        protocol: tcp
        mode: host
      - target: 443
        published: 443
        protocol: tcp
        mode: host
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - proxy_data:/letsencrypt
    networks: [edge, omni]
    deploy:
      replicas: 1
      placement:
        constraints: [node.labels.omni.role == edge]
      restart_policy: { condition: any, delay: 5s }
      resources:
        limits: { cpus: "0.50", memory: 256M }

  omniroute:
    <<: *log
    image: ${OMNIROUTE_IMAGE:-diegosouzapw/omniroute}:${OMNIROUTE_TAG:-latest}
    environment:
      TZ: ${TZ:-Europe/Berlin}
      HOST: 0.0.0.0
      PORT: "20128"
      OMNIROUTE_PORT: "20128"
      REQUIRE_API_KEY: "${REQUIRE_API_KEY:-true}"
      API_KEY: ${OMNIROUTE_API_KEY:?set OMNIROUTE_API_KEY}
      OMNIROUTE_API_KEY: ${OMNIROUTE_API_KEY:?set OMNIROUTE_API_KEY}
      OMNIROUTE_STORAGE_ENCRYPTION_KEY: ${OMNIROUTE_STORAGE_ENCRYPTION_KEY:-}
    ports:
      - target: 20128
        published: ${OMNIROUTE_PORT:-20128}
        protocol: tcp
        mode: ingress
    volumes:
      - omniroute_data:/root/.omniroute
    configs:
      - source: omniroute_config
        target: /root/.omniroute/config.json
      - source: omniroute_combos
        target: /data/omnicore-auto-combos.json
    networks: [omni]
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:20128/v1/models >/dev/null 2>&1 || curl -fsS -o /dev/null http://127.0.0.1:20128/v1/models >/dev/null 2>&1 || node -e \"require('http').get('http://127.0.0.1:20128/v1/models',r=>process.exit(r.statusCode<500?0:1)).on('error',()=>process.exit(1))\" >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 30s
    deploy:
      replicas: 1
      placement:
        constraints: [node.labels.omni.role == ai]
      restart_policy: { condition: any, delay: 5s }
      resources:
        limits: { cpus: "1.00", memory: 768M }

  db:
    <<: *log
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-omnicore}
      POSTGRES_USER: ${POSTGRES_USER:-omnichat}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata
      TZ: ${TZ:-Europe/Berlin}
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks: [omni]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-omnichat} -d ${POSTGRES_DB:-omnicore}"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s
    deploy:
      replicas: 1
      placement:
        constraints: [node.labels.omni.role == core]
      restart_policy: { condition: any, delay: 5s }
      resources:
        limits: { cpus: "1.50", memory: 4G }

  middleware:
    <<: *log
    image: ${OMNICORE_IMAGE:?set OMNICORE_IMAGE}:${OMNICORE_TAG:-local}
    environment:
      TZ: ${TZ:-Europe/Berlin}
      DATABASE_URL: postgresql://${POSTGRES_USER:-omnichat}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-omnicore}
      DATABASE_PATH: /app/data/middleware.db
      SESSION_SECRET: ${SESSION_SECRET:-}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-}
      SECRET_KEY: ${SECRET_KEY:-}
      JWT_SECRET: ${JWT_SECRET:-}
      OMNIROUTE_ENABLED: "true"
      OMNIROUTE_URL: http://omniroute:20128/v1
      OMNIROUTE_BASE_URL: http://omniroute:20128/v1
      OMNIROUTE_URL_PUBLIC: ${OMNIROUTE_URL_PUBLIC:-https://puchalla.online/v1}
      OMNIROUTE_API_KEY: ${OMNIROUTE_API_KEY:-}
      MIDDLEWARE_URL: http://middleware:8000
      UVICORN_WORKERS: ${UVICORN_WORKERS:-1}
    ports:
      - target: 8000
        published: ${MIDDLEWARE_PORT:-8002}
        protocol: tcp
        mode: ingress
    volumes:
      - app_data:/app/data
      - media_data:/app/media
      - uploads_data:/app/uploads
    networks: [omni, edge]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8000/healthz || curl -fsS http://127.0.0.1:8000/health >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 40s
    deploy:
      replicas: 1
      placement:
        constraints: [node.labels.omni.role == core]
      restart_policy: { condition: any, delay: 10s }
      update_config: { parallelism: 1, order: start-first, failure_action: rollback }
      resources:
        limits: { cpus: "2.00", memory: 6G }

  shopware:
    <<: *log
    image: ${SHOPWARE_IMAGE:-dockware/dev}:${SHOPWARE_TAG:-latest}
    environment:
      TZ: ${TZ:-Europe/Berlin}
      XDEBUG_ENABLED: "0"
    ports:
      - target: 80
        published: ${SHOPWARE_PORT:-8088}
        protocol: tcp
        mode: ingress
    volumes:
      - shopware_data:/var/www/html
    networks: [omni, edge]
    deploy:
      replicas: ${SHOPWARE_REPLICAS:-0}
      placement:
        constraints: [node.labels.omni.role == core]
      restart_policy: { condition: any }
      resources:
        limits: { cpus: "2.00", memory: 8G }

  portainer-agent:
    <<: *log
    image: portainer/agent:2.21.5
    environment:
      AGENT_CLUSTER_ADDR: tasks.portainer-agent
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/lib/docker/volumes:/var/lib/docker/volumes
      - /:/host
    networks: [agent]
    deploy:
      mode: global
      placement:
        constraints: [node.platform.os == linux]

  portainer:
    <<: *log
    image: portainer/portainer-ce:2.21.5
    command: -H tcp://tasks.portainer-agent:9001 --tlsskipverify
    ports:
      - target: 9443
        published: 9443
        protocol: tcp
        mode: host
      - target: 9000
        published: 9000
        protocol: tcp
        mode: host
    volumes:
      - portainer_data:/data
    networks: [agent, edge]
    deploy:
      replicas: 1
      placement:
        constraints: [node.role == manager]
      restart_policy: { condition: any }

  marketing:
    <<: *log
    image: ${MARKETING_IMAGE:-alpine:3.20}
    command: ["sh","-lc","echo marketing-worker placeholder; sleep 3600"]
    environment:
      TZ: ${TZ:-Europe/Berlin}
      MIDDLEWARE_URL: http://middleware:8000
      OMNIROUTE_URL: http://omniroute:20128/v1
      OMNIROUTE_API_KEY: ${OMNIROUTE_API_KEY:-}
    networks: [omni]
    deploy:
      replicas: ${MARKETING_REPLICAS:-0}
      placement:
        constraints: [node.labels.omni.role == growth]

  social:
    <<: *log
    image: ${SOCIAL_IMAGE:-alpine:3.20}
    command: ["sh","-lc","echo social-worker placeholder; sleep 3600"]
    environment:
      TZ: ${TZ:-Europe/Berlin}
      MIDDLEWARE_URL: http://middleware:8000
      OMNIROUTE_URL: http://omniroute:20128/v1
      OMNIROUTE_API_KEY: ${OMNIROUTE_API_KEY:-}
    networks: [omni]
    deploy:
      replicas: ${SOCIAL_REPLICAS:-0}
      placement:
        constraints: [node.labels.omni.role == growth]

  content-studio:
    <<: *log
    image: ${CONTENT_STUDIO_IMAGE:-alpine:3.20}
    command: ["sh","-lc","echo content-studio placeholder; sleep 3600"]
    environment:
      TZ: ${TZ:-Europe/Berlin}
      MIDDLEWARE_URL: http://middleware:8000
      OMNIROUTE_URL: http://omniroute:20128/v1
      OMNIROUTE_API_KEY: ${OMNIROUTE_API_KEY:-}
    networks: [omni]
    deploy:
      replicas: ${CONTENT_STUDIO_REPLICAS:-0}
      placement:
        constraints: [node.labels.omni.role == ai]

  coding-swarm:
    <<: *log
    image: ${CODING_SWARM_IMAGE:-alpine:3.20}
    command: ["sh","-lc","echo coding-swarm placeholder; sleep 3600"]
    environment:
      TZ: ${TZ:-Europe/Berlin}
      OMNIROUTE_URL: http://omniroute:20128/v1
      OMNIROUTE_API_KEY: ${OMNIROUTE_API_KEY:-}
    networks: [omni]
    deploy:
      replicas: ${CODING_SWARM_REPLICAS:-0}
      placement:
        constraints: [node.labels.omni.role == ai]

networks:
  omni:
    driver: overlay
    attachable: true
  edge:
    driver: overlay
    attachable: true
  agent:
    driver: overlay
    attachable: true

volumes:
  omniroute_data: {}
  pg_data: {}
  app_data: {}
  media_data: {}
  uploads_data: {}
  shopware_data: {}
  proxy_data: {}
  portainer_data: {}

configs:
  omniroute_config:
    file: ./configs/omniroute/config.json
  omniroute_combos:
    file: ./configs/omniroute/combos.optimized.json
