name: omni-enterprise

# Single-host Gesamtstack (ein Rechner, eine Datei). Profile: core|ai|edge|commerce|ops|growth|full
# Nutzung: docker compose --profile core up -d   (oder ./start-all.sh up core)

x-log: &log
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "5" }

services:
  omniroute:
    <<: *log
    profiles: ["core", "ai", "full"]
    image: ${OMNIROUTE_IMAGE:-diegosouzapw/omniroute}:${OMNIROUTE_TAG:-latest}
    container_name: ${COMPOSE_PROJECT_NAME:-omni}-omniroute
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Europe/Berlin}
      HOST: 0.0.0.0
      PORT: "20128"
      OMNIROUTE_PORT: "20128"
      REQUIRE_API_KEY: "${REQUIRE_API_KEY:-true}"
      API_KEY: ${OMNIROUTE_API_KEY:?set OMNIROUTE_API_KEY}
      OMNIROUTE_API_KEY: ${OMNIROUTE_API_KEY:?set OMNIROUTE_API_KEY}
      OMNIROUTE_STORAGE_ENCRYPTION_KEY: ${OMNIROUTE_STORAGE_ENCRYPTION_KEY:-}
    ports:
      - "${SERVICE_BIND_HOST:-0.0.0.0}:${OMNIROUTE_PORT:-20128}:20128"
    volumes:
      - omniroute_data:/root/.omniroute
      - ./stacks/swarm/configs/omniroute/config.json:/root/.omniroute/config.json:ro
      - ./stacks/swarm/configs/omniroute/combos.optimized.json:/data/omnicore-auto-combos.json:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:20128/v1/models >/dev/null 2>&1 || curl -fsS -o /dev/null http://127.0.0.1:20128/v1/models >/dev/null 2>&1 || node -e \"require('http').get('http://127.0.0.1:20128/v1/models',r=>process.exit(r.statusCode<500?0:1)).on('error',()=>process.exit(1))\" >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks: [omni]

  db:
    <<: *log
    profiles: ["core", "full"]
    image: postgres:15-alpine
    container_name: ${COMPOSE_PROJECT_NAME:-omni}-db
    restart: unless-stopped
    shm_size: 256mb
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-omnicore}
      POSTGRES_USER: ${POSTGRES_USER:-omnichat}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata
      TZ: ${TZ:-Europe/Berlin}
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./modules/middleware/db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-omnichat} -d ${POSTGRES_DB:-omnicore}"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s
    networks: [omni]

  middleware:
    <<: *log
    profiles: ["core", "full"]
    build:
      context: ./modules/middleware
      dockerfile: Dockerfile
    image: ${OMNICORE_IMAGE:-omnicore-middleware}:${OMNICORE_TAG:-local}
    container_name: ${COMPOSE_PROJECT_NAME:-omni}-middleware
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      omniroute:
        condition: service_healthy
    environment:
      TZ: ${TZ:-Europe/Berlin}
      DATABASE_URL: postgresql://${POSTGRES_USER:-omnichat}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-omnicore}
      DATABASE_PATH: /app/data/middleware.db
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:?set INTERNAL_API_KEY}
      SECRET_KEY: ${SECRET_KEY:-}
      JWT_SECRET: ${JWT_SECRET:-}
      OMNIROUTE_ENABLED: "true"
      OMNIROUTE_URL: ${OMNIROUTE_URL:-http://omniroute:20128/v1}
      OMNIROUTE_BASE_URL: ${OMNIROUTE_BASE_URL:-http://omniroute:20128/v1}
      OMNIROUTE_URL_LOCAL: ${OMNIROUTE_URL_LOCAL:-http://omniroute:20128/v1}
      OMNIROUTE_URL_PUBLIC: ${OMNIROUTE_URL_PUBLIC:-}
      OMNIROUTE_API_KEY: ${OMNIROUTE_API_KEY:-}
      SHOPWARE_URL: ${SHOPWARE_URL:-}
      SHOPWARE_CLIENT_ID: ${SHOPWARE_CLIENT_ID:-}
      SHOPWARE_CLIENT_SECRET: ${SHOPWARE_CLIENT_SECRET:-}
      SHOPWARE_SALES_CHANNEL_ID: ${SHOPWARE_SALES_CHANNEL_ID:-}
      SHOPWARE_API_VERSION: ${SHOPWARE_API_VERSION:-6.0}
      SHOPWARE_ENABLED: ${SHOPWARE_ENABLED:-false}
      ENABLE_EXTERNAL_MARKETPLACES: ${ENABLE_EXTERNAL_MARKETPLACES:-false}
      ENABLE_MATTERHORN_IMPORT: ${ENABLE_MATTERHORN_IMPORT:-true}
      SHARED_MEDIA_ROOT: ${SHARED_MEDIA_ROOT:-/mnt/local-data/omni-assets}
      MIDDLEWARE_URL: http://middleware:8000
      UVICORN_WORKERS: ${UVICORN_WORKERS:-1}
      UVICORN_LOOP: uvloop
      UVICORN_HTTP: httptools
    ports:
      - "${SERVICE_BIND_HOST:-0.0.0.0}:${MIDDLEWARE_PORT:-8002}:8000"
    volumes:
      - app_data:/app/data
      - ${MEDIA_PATH:-./runtime/middleware-media}:/app/media
      - ${UPLOADS_PATH:-./runtime/middleware-uploads}:/app/uploads
      - ${SHARED_MEDIA_ROOT:-/mnt/local-data/omni-assets}:/app/shared-assets
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8000/healthz || curl -fsS http://127.0.0.1:8000/health >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 40s
    networks: [omni]

  shopware:
    <<: *log
    profiles: ["commerce", "full"]
    image: dockware/dev:latest
    container_name: ${COMPOSE_PROJECT_NAME:-omni}-shopware
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Europe/Berlin}
      XDEBUG_ENABLED: "0"
    ports:
      - "${SERVICE_BIND_HOST:-0.0.0.0}:${SHOPWARE_PORT:-8088}:80"
    volumes:
      - shopware_data:/var/www/html
    networks: [omni]

  edge-proxy:
    <<: *log
    profiles: ["edge", "full"]
    image: traefik:v3.1
    container_name: ${COMPOSE_PROJECT_NAME:-omni}-proxy
    restart: unless-stopped
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - "${SERVICE_BIND_HOST:-0.0.0.0}:--entrypoints.web.address=:80"
      - "${SERVICE_BIND_HOST:-0.0.0.0}:--entrypoints.websecure.address=:443"
      - --api.dashboard=true
      - --api.insecure=${TRAEFIK_API_INSECURE:-false}
    ports:
      - "${SERVICE_BIND_HOST:-0.0.0.0}:${TRAEFIK_HTTP_PORT:-80}:80"
      - "${TRAEFIK_HTTPS_PORT:-443}:443"
      - "${SERVICE_BIND_HOST:-0.0.0.0}:${TRAEFIK_DASHBOARD_PORT:-8080}:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - proxy_data:/letsencrypt
    networks: [omni]

  portainer:
    <<: *log
    profiles: ["ops", "full"]
    image: portainer/portainer-ce:2.21.5
    container_name: ${COMPOSE_PROJECT_NAME:-omni}-portainer
    restart: unless-stopped
    ports:
      - "${SERVICE_BIND_HOST:-0.0.0.0}:${PORTAINER_HTTP_PORT:-9000}:9000"
      - "${PORTAINER_HTTPS_PORT:-9443}:9443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data
    networks: [omni]

  marketing:
    <<: *log
    profiles: ["growth", "full"]
    image: ${MARKETING_IMAGE:-alpine:3.20}
    container_name: ${COMPOSE_PROJECT_NAME:-omni}-marketing
    restart: unless-stopped
    command: ["sh","-lc","echo marketing-worker ready; while true; do sleep 3600; done"]
    environment:
      TZ: ${TZ:-Europe/Berlin}
      MIDDLEWARE_URL: http://middleware:8000
      OMNIROUTE_URL: http://omniroute:20128/v1
      OMNIROUTE_API_KEY: ${OMNIROUTE_API_KEY:-}
    networks: [omni]

  social:
    <<: *log
    profiles: ["growth", "full"]
    image: ${SOCIAL_IMAGE:-alpine:3.20}
    container_name: ${COMPOSE_PROJECT_NAME:-omni}-social
    restart: unless-stopped
    command: ["sh","-lc","echo social-worker ready; while true; do sleep 3600; done"]
    environment:
      TZ: ${TZ:-Europe/Berlin}
      MIDDLEWARE_URL: http://middleware:8000
      OMNIROUTE_URL: http://omniroute:20128/v1
      OMNIROUTE_API_KEY: ${OMNIROUTE_API_KEY:-}
    networks: [omni]

  content-studio:
    <<: *log
    profiles: ["ai", "full"]
    image: ${CONTENT_STUDIO_IMAGE:-alpine:3.20}
    container_name: ${COMPOSE_PROJECT_NAME:-omni}-content-studio
    restart: unless-stopped
    command: ["sh","-lc","echo content-studio ready; while true; do sleep 3600; done"]
    environment:
      TZ: ${TZ:-Europe/Berlin}
      MIDDLEWARE_URL: http://middleware:8000
      OMNIROUTE_URL: http://omniroute:20128/v1
      OMNIROUTE_API_KEY: ${OMNIROUTE_API_KEY:-}
    networks: [omni]

  coding-swarm:
    <<: *log
    profiles: ["ai", "full"]
    image: ${CODING_SWARM_IMAGE:-alpine:3.20}
    container_name: ${COMPOSE_PROJECT_NAME:-omni}-coding-swarm
    restart: unless-stopped
    command: ["sh","-lc","echo coding-swarm ready; while true; do sleep 3600; done"]
    environment:
      TZ: ${TZ:-Europe/Berlin}
      OMNIROUTE_URL: http://omniroute:20128/v1
      OMNIROUTE_API_KEY: ${OMNIROUTE_API_KEY:-}
      WORKSPACE_ROOT: /workspace
    volumes:
      - ./modules/coding-swarm/workspace:/workspace
    networks: [omni]


  zerotier:
    image: ${ZEROTIER_IMAGE:-zerotier/zerotier:latest}
    container_name: ${COMPOSE_PROJECT_NAME:-omni}-zerotier
    restart: unless-stopped
    profiles: ["zt"]
    network_mode: host
    cap_add:
      - NET_ADMIN
      - SYS_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    volumes:
      - zerotier_data:/var/lib/zerotier-one
    environment:
      ZT_NETWORK_ID: ${ZT_NETWORK_ID:-}
    command: ["sh","-lc","zerotier-one -d; sleep 3; if [ -n \"${ZT_NETWORK_ID:-}\" ]; then zerotier-cli join ${ZT_NETWORK_ID} || true; fi; tail -f /dev/null"]
    healthcheck:
      test: ["CMD-SHELL", "zerotier-cli info >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

networks:
  omni:
    name: ${COMPOSE_PROJECT_NAME:-omni}_net
    driver: bridge

volumes:
  zerotier_data:
    name: ${COMPOSE_PROJECT_NAME:-omni-enterprise}_zerotier_data
  omniroute_data: {}
  pg_data: {}
  app_data: {}
  middleware_media: {}
  middleware_uploads: {}
  shopware_data: {}
  proxy_data: {}
  portainer_data: {}
